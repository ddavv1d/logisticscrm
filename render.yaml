# Render Blueprint — деплой в 1 клик (полностью бесплатно).
# Web-сервис (Docker: FastAPI раздаёт фронт + API) + бесплатный PostgreSQL.
# Render читает этот файл: https://render.com/deploy?repo=<github-url>
services:
  - type: web
    name: logisticscrm
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logisticscrm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Render сгенерит стойкий секрет
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: "*" # single-service: фронт и API на одном домене
      - key: PYTHONPATH
        value: /app

databases:
  - name: logisticscrm-db
    plan: free
    databaseName: logisticscrm
    postgresMajorVersion: "16"
